# Logstash Configuration for Brontolano Business Suite
# This configuration reads from local log files and outputs to Elasticsearch

input {
  # Read log files from var/log directory
  file {
    path => "/var/log/*.log"
    start_position => "beginning"
    codec => "json"
    # Handle log rotation
    sinced => "/var/log/.logrotate.state"
  }

  # Syslog input (optional)
  syslog {
    port => 514
    codec => "json"
  }

  # Docker logs input (optional for containerized environments)
  docker {
    path => "/var/lib/docker/containers/*/*/*.log"
    codec => "json"
  }
}

filter {
  # Add timestamp for all events
  mutate {
    add_field => { "@timestamp" => "%{@timestamp}" }
  }

  # Remove sensitive data
  mutate {
    remove_field => "password"
    remove_field => "secret"
    remove_field => "token"
    remove_field => "authorization"
    remove_field => "credit_card"
    remove_field => "ssn"
  }

  # Normalize log levels
  if [message] =~ /ERROR|CRITICAL|WARN|WARNING|INFO|DEBUG/ {
    mutate {
      add_field => { "log_level" => "%{message}" }
      remove_field => "message"
    }
  }

  # Parse and normalize log fields
  mutate {
    add_field => { "service" => "%{@fields}[service]" }
    add_field => { "host" => "%{@fields}[host]" }
    add_field => { "app" => "%{@fields}[app]" }
    remove_field => "@fields"
  }

  # If no fields, extract from raw message
  if ![@fields] {
    grok {
      patterns => {
        default => "%{TIMESTAMP_ISO8601} %{LOGLEVEL} (%{PROGRAM})\s+%{QUOTEDSTRING:message}"
      }
      add_field => { "log_level" => "level" }
      add_field => { "app_name" => "program" }
    }
  }

  # Add processing metadata
  mutate {
    add_field => { "processed_at" => "%{@timestamp}" }
    add_field => { "log_source" => "application" }
    add_field => { "pipeline_version" => "1.0.0" }
  }

  # GeoIP lookup for source tracking
  geoip {
    source => "host"
  }

  # Rename log_level to level if message field was removed
  if [log_level] {
    mutate {
      rename => "log_level" => "level"
    }
  }
}

output {
  # Elasticsearch output
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # Uncomment for authentication
    # auth => ["elastic", "YOUR_PASSWORD"]
    # Index with daily rotation
    index => "brontolano-logs-%{+yyyy.MM.dd}"
    # Use index lifecycle management (ILM)
    ilm_enabled => true
    ilm_rollover_alias => "brontolano-logs"
    ilm_rollover_conditions => {
      max_docs => 1000000
      max_age => "30d"
    }
    template => false
    # Request acknowledgment
    manage_ilm => true
    flush_events => 1
  }

  # Console output for debugging (remove in production)
  stdout {
    codec => "json"
    pretty => true
  }

  # File output for backup and troubleshooting
  file {
    path => "/var/log/processed.log"
    codec => "json"
    rotate_every => "5m"
    rotate => 5
  }
}